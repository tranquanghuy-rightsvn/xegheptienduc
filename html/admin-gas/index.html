<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trang quản trị - Nhà Xe Tiến Đức</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <!--
      ĐƯỜNG LUI của trang quản trị: tienductransport.vn/admin-gas/
      Mở CMS theo cách cũ (chuyển hướng thẳng ra Apps Script). Dùng khi trình duyệt nào đó
      không cho nhúng, khiến /admin/ (bản nhúng) không vào được.
      Nhược điểm so với /admin/: hiện thanh cảnh báo của Google và lộ URL script.google.com
      trên thanh địa chỉ - chấp nhận được vì đây chỉ là phương án dự phòng.

      Ca đã gặp thật ở dự án cùng kiểu triển khai (xevipsanbay.com): Chrome đang đăng nhập
      tài khoản Google Workspace của tổ chức bị Google chuyển hướng sang
      script.google.com/a/macros/<domain>/... rồi treo vĩnh viễn khi bị nhúng; đăng nhập bằng
      Gmail cá nhân thì nhúng chạy bình thường. Vì vậy luôn phải giữ trang này.

      URL Apps Script nằm ở ĐÚNG 2 CHỖ: file này và html/admin/index.html. Deploy lại CMS ra
      URL mới thì sửa cả 2.

      File TĨNH, sửa tay - scripts/build.py cố ý KHÔNG sinh lại thư mục này.
    -->
    <style>
      body {
        font-family: system-ui, "Segoe UI", sans-serif;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; background: #f5f5f0; color: #17281d;
      }
      .box { text-align: center; padding: 32px; }
      a { color: #0a4a26; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="box">
      <p>Đang chuyển tới trang quản trị…</p>
      <p><a id="cms-link" href="#" rel="nofollow noreferrer noopener">Bấm vào đây nếu trình duyệt không tự chuyển</a></p>
    </div>
    <script>
      var GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbwuJx-20EuTcb_U1FhfFZgBxvn_fHmfCw0fjJ9oLlqC2lPNHM84uoJIGApgF5gvxKXp/exec";
      if (GAS_EXEC_URL) {
        document.getElementById("cms-link").href = GAS_EXEC_URL;
        location.replace(GAS_EXEC_URL);
      } else {
        document.querySelector(".box p").textContent =
          "Chưa cấu hình đường dẫn trang quản trị (GAS_EXEC_URL trong html/admin-gas/index.html).";
      }
    </script>
  </body>
</html>
