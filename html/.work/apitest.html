<!doctype html><meta charset="utf-8">
<div id="log" style="font:13px monospace;white-space:pre-wrap;padding:10px;background:#111;color:#0f0"></div>
<iframe id="f" src="../index.html?at=1" width="1200" height="1600" style="border:0;display:block"></iframe>
<script>
var out = document.getElementById('log');
function log(s){ out.textContent += s + "\n"; }
var f = document.getElementById('f');
f.onload = function(){
  setTimeout(function(){
    try {
      var d = f.contentDocument;
      var w = f.contentWindow;
      log("TienDucApi defined: " + (typeof w.TienDucApi));
      log("TienDucAddressAutocomplete defined: " + (typeof w.TienDucAddressAutocomplete));
      var pickup = d.getElementById('f-pickup');
      log("pickup has class place-autocomplete-input: " + pickup.classList.contains('place-autocomplete-input'));
      var wrap = pickup.parentElement;
      log("wrapper class: " + wrap.className);
      var list = wrap.querySelector('.address-suggestions');
      log("suggestions list found: " + !!list + " hidden=" + (list && list.hidden));

      // Giả lập gõ chữ để kích hoạt fetch (sẽ bị CORS chặn - chỉ kiểm tra cơ chế không lỗi JS)
      var origError = w.console.error;
      var errors = [];
      w.console.error = function(){ errors.push(Array.prototype.slice.call(arguments).join(' ')); origError.apply(w.console, arguments); };

      pickup.value = "Hạ Long";
      pickup.dispatchEvent(new w.Event('input', {bubbles:true}));

      setTimeout(function(){
        log("---sau 900ms (chờ debounce 250ms + fetch)---");
        log("errors captured: " + JSON.stringify(errors));
        log("list.hidden after typing: " + list.hidden);
      }, 900);
    } catch(e) {
      log("ERROR: " + e.message + "\n" + e.stack);
    }
  }, 400);
};
</script>
