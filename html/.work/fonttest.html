<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../css/style.css">
<style>
body{background:#04240f;color:#fff;font-family:"Montserrat",sans-serif;padding:16px;margin:0}
div{font-size:40px;font-weight:800;margin:6px 0;border:1px dashed #3a5}
.a{color:#e9c26a}
.b{background:linear-gradient(180deg,#f8e2ab,#b8811f);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.c{background:linear-gradient(180deg,#f8e2ab,#b8811f);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.7}
.d{color:#e9c26a;font-weight:700}
.e{color:#e9c26a;font-weight:600}
.f{color:#e9c26a;font-family:Arial,sans-serif}
</style>
<div class="a">TIẾN ĐỨC — a: màu đặc, 800</div>
<div class="b">TIẾN ĐỨC — b: clip text, lh 1</div>
<div class="c">TIẾN ĐỨC — c: clip text, lh 1.7</div>
<div class="d">TIẾN ĐỨC — d: màu đặc, 700</div>
<div class="e">TIẾN ĐỨC — e: màu đặc, 600</div>
<div class="f">TIẾN ĐỨC — f: Arial</div>
