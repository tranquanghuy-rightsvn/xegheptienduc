<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trang quản trị - Nhà Xe Tiến Đức</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <!--
      Trang quản trị: tienductransport.vn/admin/ - NHÚNG CMS thẳng vào domain của mình thay
      vì chuyển hướng ra script.google.com như bản cũ.
      Được 2 thứ: thanh địa chỉ luôn là tienductransport.vn, và cắt được thanh cảnh báo
      "This application was created by a Google Apps Script user" (cao đúng 25px, đã đo ở dự
      án xevipsanbay.com cùng kiểu triển khai).
      Cắt bằng CSS: kéo iframe lên 25px trong khung overflow:hidden. KHÔNG đụng vào DOM trang
      kia - khác origin nên không thể đụng, và cũng không cần.

      ⚠️ PHỤ THUỘC: TinyMCE của CMS phải được TỰ HOST tại /vendor/tinymce/ trên chính domain
      này (xem gas/js.html dòng đầu). Khi CMS nằm trong iframe lồng khác origin, trình soạn
      thảo gọi tài nguyên từ CDN lạ là nhóm nguyên nhân hay chết im lặng nhất - đây chính là
      lý do bản nhúng phải đi kèm bản TinyMCE offline, không tách rời được.

      ĐƯỜNG LUI: /admin-gas/ - bản chuyển hướng thẳng ra Apps Script, luôn chạy được. Trang
      này tự chỉ sang đó nếu 12 giây không tải được. Luôn giữ đường lui vì có ít nhất 1 ca
      không thể nhúng: trình duyệt đang đăng nhập tài khoản Google Workspace của tổ chức bị
      Google chuyển hướng sang script.google.com/a/macros/<domain>/... rồi treo vĩnh viễn.

      File TĨNH, sửa tay - scripts/build.py cố ý KHÔNG sinh lại thư mục này.
    -->
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5f5f0;
        font-family: system-ui, "Segoe UI", sans-serif;
        color: #17281d;
      }
      /* Chiều cao thanh cảnh báo của Google. Google đổi giao diện thì sửa đúng 1 con số này. */
      :root { --gg-warning-height: 25px; }

      .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
      .cms-frame {
        position: absolute;
        top: calc(var(--gg-warning-height) * -1);
        left: 0;
        width: 100%;
        height: calc(100% + var(--gg-warning-height));
        border: 0;
        display: block;
      }

      /* Lớp phủ báo trạng thái - nằm ĐÈ LÊN iframe và tự ẩn khi iframe tải xong thật. Nếu để
         chìm dưới thì lúc iframe treo người dùng chỉ thấy màn hình trắng, không biết chuyện gì. */
      .cms-status {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 24px; background: #f5f5f0;
      }
      .cms-status.hidden { display: none; }
      .cms-status h2 { font-size: 18px; margin: 0 0 8px; color: #06381d; }
      .cms-status p { font-size: 14px; color: #4c5c51; margin: 6px 0; line-height: 1.6; }
      .cms-status a {
        display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 8px;
        background: #0a4a26; color: #f5d489; text-decoration: none; font-weight: 700;
      }
      .spinner {
        width: 32px; height: 32px; margin: 0 auto 16px;
        border: 3px solid rgba(0, 0, 0, .1); border-top-color: #d8a441; border-radius: 50%;
        animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="cms-status" id="cms-status">
      <div>
        <div class="spinner" id="cms-spinner"></div>
        <h2 id="cms-status-title">Đang mở trang quản trị…</h2>
        <p id="cms-status-text">Nếu quá 12 giây vẫn chưa vào được, dùng nút bên dưới.</p>
        <a id="cms-open-tab" href="/admin-gas/" rel="nofollow noreferrer" style="display: none">Mở theo cách thường</a>
      </div>
    </div>

    <div class="cms-viewport">
      <iframe class="cms-frame" id="cms-frame" title="Trang quản trị" referrerpolicy="no-referrer"></iframe>
    </div>

    <script>
      var CMS_URL = "https://script.google.com/macros/s/AKfycbwuJx-20EuTcb_U1FhfFZgBxvn_fHmfCw0fjJ9oLlqC2lPNHM84uoJIGApgF5gvxKXp/exec";

      var frame = document.getElementById("cms-frame");
      var statusBox = document.getElementById("cms-status");
      var loaded = false;

      // Sự kiện load của iframe VẪN bắn kể cả khi nội dung khác origin (chỉ là không đọc được
      // bên trong) - đủ để phân biệt "đã tải được" với "treo".
      frame.addEventListener("load", function () {
        loaded = true;
        statusBox.classList.add("hidden");
        console.log("[admin] nhúng thành công");
      });

      // Treo quá lâu -> hiện lối thoát, không để người dùng nhìn màn hình trắng.
      setTimeout(function () {
        if (loaded) return;
        console.warn("[admin] không nhúng được sau 12 giây - chuyển sang dùng /admin-gas/");
        document.getElementById("cms-spinner").style.display = "none";
        document.getElementById("cms-status-title").textContent = "Không nhúng được trang quản trị";
        document.getElementById("cms-status-text").textContent =
          "Trình duyệt này không cho hiển thị trang quản trị bên trong website. Bấm nút bên dưới để mở theo cách thường.";
        document.getElementById("cms-open-tab").style.display = "inline-block";
      }, 12000);

      frame.src = CMS_URL;
    </script>
  </body>
</html>
